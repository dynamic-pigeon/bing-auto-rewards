name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: bing-auto-reward
            asset_suffix: linux-x86_64
            extension: tar.gz
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: bing-auto-reward
            asset_suffix: linux-aarch64
            extension: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: bing-auto-reward.exe
            asset_suffix: windows-x86_64
            extension: zip
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: bing-auto-reward.exe
            asset_suffix: windows-aarch64
            extension: zip
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: bing-auto-reward
            asset_suffix: macos-aarch64
            extension: tar.gz

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Configure MSVC for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Package Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "release-package"
          $archive = "bing-auto-reward-${{ github.ref_name }}-${{ matrix.asset_suffix }}.${{ matrix.extension }}"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE $archive

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $packageDir
          Copy-Item -Path "README.md", "LICENSE" -Destination $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archivePath -Force

      - name: Package Unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/release-package"
          archive="bing-auto-reward-${{ github.ref_name }}-${{ matrix.asset_suffix }}.${{ matrix.extension }}"
          archive_path="$GITHUB_WORKSPACE/$archive"

          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          tar -C "$package_dir" -czf "$archive_path" .

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: bing-auto-reward-${{ github.ref_name }}-${{ matrix.asset_suffix }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          pushd release-assets
          sha256sum * > SHA256SUMS
          popd

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
