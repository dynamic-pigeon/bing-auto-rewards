name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bing-auto-reward
            archive_ext: tar.gz
            archive_name: amd64-linux-bing-auto-reward-${{ github.ref_name }}
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: bing-auto-reward
            archive_ext: tar.gz
            archive_name: aarch64-linux-bing-auto-reward-${{ github.ref_name }}
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: bing-auto-reward.exe
            archive_ext: zip
            archive_name: aarch64-windows-bing-auto-reward-${{ github.ref_name }}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bing-auto-reward.exe
            archive_ext: zip
            archive_name: amd64-windows-bing-auto-reward-${{ github.ref_name }}
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bing-auto-reward
            archive_ext: tar.gz
            archive_name: aarch64-macos-bing-auto-reward-${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install Linux aarch64 toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set up MSVC for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Prepare release assets
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: |
          # 确定源文件路径
          $SOURCE_DIR = "target/${{ matrix.target }}/release"
          $BINARY_PATH = Join-Path $SOURCE_DIR "${{ matrix.binary_name }}"

          # 确定资源文件和目录
          $RESOURCES = @("config.json", "log4rs.yaml")

          # 创建临时打包目录
          $PACKAGE_DIR = "release_package"
          New-Item -ItemType Directory -Path $PACKAGE_DIR | Out-Null

          # 复制二进制文件和资源
          Copy-Item $BINARY_PATH -Destination $PACKAGE_DIR
          foreach ($res in $RESOURCES) {
            if (Test-Path $res) {
              Copy-Item $res -Destination $PACKAGE_DIR
            }
          }
          # 根据系统类型创建压缩包
          $ARCHIVE_NAME = "${{ matrix.archive_name }}"
          Compress-Archive -Path "$PACKAGE_DIR\*" -DestinationPath "${ARCHIVE_NAME}.zip"
          echo "ASSET_PATH=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV

      - name: Prepare release assets
        shell: bash
        if: matrix.os != 'windows-latest'
        run: |
          # 确定源文件路径
          SOURCE_DIR="target/${{ matrix.target }}/release"
          BINARY_PATH="$SOURCE_DIR/${{ matrix.binary_name }}"

          # 确定资源文件和目录
          RESOURCES=("config.json" "log4rs.yaml")

          # 创建临时打包目录
          PACKAGE_DIR="release_package"
          mkdir -p "$PACKAGE_DIR"

          # 复制二进制文件和资源
          cp "$BINARY_PATH" "$PACKAGE_DIR/"
          for res in "${RESOURCES[@]}"; do
            if [ -f "$res" ]; then
              cp "$res" "$PACKAGE_DIR/"
            fi
          done

          # 根据系统类型创建压缩包
          ARCHIVE_NAME="${{ matrix.archive_name }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd "$PACKAGE_DIR" && zip -r "../${ARCHIVE_NAME}.zip" .)
            echo "ASSET_PATH=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            (cd "$PACKAGE_DIR" && tar -czf "../${ARCHIVE_NAME}.tar.gz" .)
            echo "ASSET_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
