name: Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: bing-auto-reward
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: bing-auto-reward.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: bing-auto-reward
            archive_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1

      - name: Prepare release assets
        shell: pwsh
        if: matrix.os == 'windows-latest'
        run: |
          # 确定源文件路径
          $SOURCE_DIR = "target/${{ matrix.target }}/release"
          $BINARY_PATH = Join-Path $SOURCE_DIR "${{ matrix.binary_name }}"

          # 确定资源文件和目录
          $RESOURCES = @("config.json", "log4rs.yaml")

          # 创建临时打包目录
          $PACKAGE_DIR = "release_package"
          New-Item -ItemType Directory -Path $PACKAGE_DIR | Out-Null

          # 复制二进制文件和资源
          Copy-Item $BINARY_PATH -Destination $PACKAGE_DIR
          foreach ($res in $RESOURCES) {
            if (Test-Path $res) {
              Copy-Item $res -Destination $PACKAGE_DIR
            }
          }
          # 根据系统类型创建压缩包
          $ARCHIVE_NAME = "bing-auto-reward-latest-${{ matrix.target }}"
          Compress-Archive -Path "$PACKAGE_DIR\*" -DestinationPath "${ARCHIVE_NAME}.zip"
          echo "ASSET_PATH=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV


      - name: Prepare release assets
        shell: bash
        if: matrix.os != 'windows-latest'
        run: |
          # 确定源文件路径
          SOURCE_DIR="target/${{ matrix.target }}/release"
          BINARY_PATH="$SOURCE_DIR/${{ matrix.binary_name }}"

          # 确定资源文件和目录
          RESOURCES=("config.json" "log4rs.yaml")
          
          # 创建临时打包目录
          PACKAGE_DIR="release_package"
          mkdir -p "$PACKAGE_DIR"
          
          # 复制二进制文件和资源
          cp "$BINARY_PATH" "$PACKAGE_DIR/"
          for res in "${RESOURCES[@]}"; do
            if [ -f "$res" ]; then
              cp "$res" "$PACKAGE_DIR/"
            fi
          done
          
          # 根据系统类型创建压缩包
          ARCHIVE_NAME="bing-auto-reward-latest-${{ matrix.target }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd "$PACKAGE_DIR" && zip -r "../${ARCHIVE_NAME}.zip" .)
            echo "ASSET_PATH=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            (cd "$PACKAGE_DIR" && tar -czf "../${ARCHIVE_NAME}.tar.gz" .)
            echo "ASSET_PATH=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          token: ${{ secrets.GHP_TOKEN }}
