[package]
name = "bing-auto-reward"
version = "0.2.7"
edition = "2024"
authors = ["dynamic-pigeon <3040313336@qq.com>"]
license = "MIT"

[dependencies]
chromiumoxide = "0.9"
chromiumoxide_cdp = "0.9"
futures = "0.3"
tempfile = "3.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.13", features = ["json", "rustls"] }
anyhow = "1.0"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8.4"
croner = "3.0.1"
chrono = "0.4"
linkme = "0.3"
const_format = "0.2.35"
parking_lot = { version = "0.12.5", features = ["arc_lock", "send_guard"] }
regex = "1.12"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
rayon = "1.11"

[features]
debug = []
