[package]
name = "bing-auto-reward"
version = "0.1.4"
edition = "2024"
authors = ["dynamic-pigeon <3040313336@qq.com>"]
license = "MIT"

[dependencies]
headless_chrome = "1.0"
tempfile = "3.3"
log = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.24.0"
anyhow = "1.0"
log4rs = "1.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8.4"
croner = "3.0.1"
chrono = "0.4"
linkme = "0.3"
const_format = "0.2.35"
parking_lot = "0.12.5"

[dev-dependencies]
rayon = "1.11"

[features]
debug = []
